<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workshop Registration Form</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        margin: 0;
        padding: 20px;
    }

    .container {
        max-width: 600px;
        background: white;
        margin: auto;
        padding: 25px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h2 {
        text-align: center;
        margin-bottom: 10px;
    }

    p {
        text-align: center;
        font-size: 14px;
        color: #555;
    }

    label {
        display: block;
        margin-top: 20px;
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 14px;
    }

    .row {
        display: flex;
        gap: 10px;
    }

    .row input {
        width: 100%;
    }

    .small-text {
        font-size: 12px;
        color: gray;
        margin-top: 3px;
    }

    button {
        width: 100%;
        padding: 12px;
        margin-top: 25px;
        background: #007BFF;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background: #0056b3;
    }
</style>
</head>

<body>

<div class="container">
    <h2>Workshop Registration Form</h2>
    <p>Please complete this form to register for our upcoming workshop.</p>
    <p>Fields are required. We appreciate your interest and look forward to your participation.</p>

    <form>
        <label>Date *</label>
        <input type="date">

        <label>Company</label>
        <input type="text" placeholder="Enter your company">

        <label>Name *</label>
        <div class="row">
            <div>
                <input type="text" placeholder="First Name">
                <div class="small-text">First Name</div>
            </div>
            <div>
                <input type="text" placeholder="Last Name">
                <div class="small-text">Last Name</div>
            </div>
        </div>

        <label>Position</label>
        <input type="text" placeholder="Enter your position">

        <label>Gender*</label>
            <div class="row">
                <label>
                    <input type="radio" name="gender" value="Male" required> Male
                </label>
                <label>
                    <input type="radio" name="gender" value="Female"> Female
                </label>
            </div>

        <button type="submit">Submit</button>
    </form>
</div>

</body>
</html>
